<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8"/>
      <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
      <title>Password Generator || chiboy</title>
      <link rel="stylesheet" href="styles/password-gen.css">
      <link rel="stylesheet" href="scripts/password-gen.js">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  </head>
  <body>
    <!--Wrappper-->
    <div class="container">

        <!--Heading-->
        <h1>Password Generator</h1>

        <!--Input div where password display-->
        <div class="display-container">
          <!--input-->
          <input type="text"
          readonly placeholder="Password"
          class="Display"
          data-passwordDisplay>

          <!--copy wall button-->
          <!--onclick text show copied-->

          <button class="copy-btn" data-copy>
            <span class="copy-tooltip" data-copyMsg></span>
          <!--copy wall img-->
            <img src="img-icon/copy-regular-full.svg"
            alt="copy"
            height="20"
            width="22">
          </button>
        </div>

        <!--input wall field where I set password checkbox-->

        <div class="input-container">
          <!--password length heading and number which keeps changing-->
          <div class="length-container">
            <p>Password Length</p>
            <p data-lengthNumber>5</p>
          </div>

          <!--slide banner-->
            <input type="range"
             min="1" 
             max="30" 
             step="1" 
             class="slider" 
             data-lengthSlider>

          <!--check boxes div-->
            <div class="checkboxgroup">
              <div class="check">
                <input type="checkbox" id="uppercase">
                <label for="uppercase">Include Uppercase letters</label>
              </div>
              <div class="check">
                <input type="checkbox" id="lowercase">
                <label for="uppercase">Include Lowercase letters</label>
              </div>
              <div class="check">
                <input type="checkbox" id="numbers">
                <label for="uppercase">Include Numbers</label>
              </div>
              <div class="check">
                <input type="checkbox" id="symbols">
                <label for="uppercase">Include Symbols</label>
              </div>
            </div>
 
            <!--strength wall-->
              <div class="strenghcontainer">
                <p>Strength</p>
              <div class="indicator" data-indicator></div>
              </div>

              <!--Generate password btn-->
                <button class="generate-btn">Generate Password</button>
        </div>
    </div>
  </body>
</html>
