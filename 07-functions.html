    function covertToFahrenheit(celsius) {
      return (celsius * 9/5) + 32;
    }

    console.log(covertToFahrenheit(25))


    function convertToCelsius(fahrenheit) {
      return (fahrenheit - 32) * 5/9;
    }

    console.log(convertToCelsius(86));

    function convertTemperature(degrees, unit) {
      if (unit === 'C') {
        const result = covertToFahrenheit(degrees)
        return `${result}F`;
      } else if (unit === 'F') {
        const result = convertToCelsius(degrees)
        return `${result}C`
      }
    }

    console.log(convertTemperature(25, 'C'));
    console.log(convertTemperature(86, 'F'));

    function convertLength(length, from, to) {
      if (from === 'km' &&  to === 'miles') {
        return `${length / 1.6} miles`;
      } else if (from === 'miles' && to === 'km') {
        return `${length * 1.6} km`
      }

    //i can also do if(from === 'km' && to === 'km') {....}
    //if(from === to) is a trick i can also use to save some code
    else if (from === to) {
      return `${length} ${to}`;
      }
    }

    console.log(convertLength(50, 'miles', 'km'));
    console.log(convertLength(32, 'km', 'miles'));
    console.log(convertLength(50, 'km', 'km'));


    function convertLength(length, from, to) {
      if (from === 'km' && to === 'miles') {
        return `${length / 1.6} ${to}`

      } else if(from === 'km' && to === 'ft') {
        return `${length * 3281} ${to}`

      } else if(from === 'miles' && to === 'km') {
        return `${length * 1.6} ${to}`

      } else if(from === 'miles' && to === 'ft') {
        return `${length * 5280} ${to}`

      } else if(from === 'ft' && to === 'km') {
        return `${length * 3281} ${to}`

      } else if(from === 'ft' && to === 'miles') {
        return `${length * 5280} ${to}`
      }

      //i can also do if(from === 'km && to === 'km') {...}
      //I used if(from === to) trick to save code in this exercise

      else if (from === to) {
        return `${length} ${to}`;
      }
    }

    console.log(convertLength(5, 'miles', 'km'));
    console.log(convertLength(5, 'miles', 'ft'));
    console.log(convertLength(5, 'km', 'ft'));


    function convertLength(length, from, to) {
    //I like to put the invalid checks at the top since it's a bit easier to see.
    // and also, if something is invalid.
    //we can skip the rest of the functions
      if (from !== 'km' && to !== 'miles' && from !=='ft') {
        return `ìnvalid unit: ${from}`;
      }  else if (to !== 'km' && to !== 'miles' && to !== 'ft') {
        return `invalid unit: ${to}`;
      }

      if (from === 'km' && to === 'miles') {
        return `${length / 1.6} ${to}`

      } else if(from === 'km' && to === 'ft') {
        return `${length * 3281} ${to}`

      } else if(from === 'miles' && to === 'km') {
        return `${length * 1.6} ${to}`

      } else if(from === 'miles' && to === 'ft') {
        return `${length * 5280} ${to}`

      } else if(from === 'ft' && to === 'km') {
        return `${length * 3281} ${to}`

      } else if(from === 'ft' && to === 'miles') {
        return `${length * 5280} ${to}`
      }

      else if (from === to) {
        return `${length} ${to}`;
      }
    }

    console.log(convertLength(50, 'miles', 'km'));
