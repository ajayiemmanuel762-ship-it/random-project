<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles/Quiz-Game.css">
  <title>Quiz-Game</title>
</head>
<body>
  <div class="container">

    <div class="screen active" id="start-screen">
      <h1>Quiz Time!</h1>
      <p>Test your knowledge with these fun questions</p>
      <button id="start-btn">Start Quiz</button>
    </div>
    
    <div class="screen" id="quiz-screen">
      <div class="quiz-header">
        <h2 id="question-text">Questions go here</h2> 
        <div class="quiz-info">
          <p>Questions <span id="current-question">1</span> of <span id="total-questions">10</span></p>

          <p>Score <span id="score">0</span></p>
        </div>
      </div>

      <div id="answers-container" class="answers-container">
        <!--Answer buttons will be inserted here from my JS code(script element)-->
      </div>

      <div class="progress-bar">
        <div id="progress" class="progress"></div>
      </div>
    </div>

    <div id="result-screen" class="screen">
      <h1>Quiz Results</h1>
      <div class="result-info">
        <p>You scored <span id="final-score">0</span> out of <span id="max-score">5</span></p>

        <div id="result-message">Are you dumb!?</div>
      </div>
      <button id="restart-btn">Restart Quiz</button>
    </div>
  </div>

  <script src="scripts/Quiz-Game.js"></script>
</body>
</html>
