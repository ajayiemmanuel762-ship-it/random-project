<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/proton.css">
    <title>Proton landing page</title>
  <body>
    <section>
      <div class="signup">  
        <form action="" class="signupForm">
          <h1>Proton VPN</h1>
          <label class="sign" for="">Sign in</label>
          <h6>Enter your Proton Account details.</h6>

          <!--Input section-->
            <div class="input-box">
              <label for="">Email or Username</label>
              <input type="email" placeholder="yourname@gmail.com">

              <label for="">Password</label>
              <input type="password" placeholder="Password">
            </div>

          <!--buttons & paragraphs-->
          <div class="footer">
            <button class="sign-btn">Sign in</button>
            <button class="create-btn">Create account</button>
            <button class="sso">Sign in with SSO</button>
          </div>
          
            <div class="footer-2">
              <P class="help">Help<P>
              <img class="circle" src="img-icon/circle-question-regular-full.svg">
            </div>
        </form>
    </section>
    <script></script>
  </body>
