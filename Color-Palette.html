<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Color Palette Generator</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="styles/Color-Palette.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title">Color Palette Generator</h1>
      <button id="generate-btn">
        <i class="fas fa-sync-alt"></i>
        Generate Palette
      </button>

      <div class="palette-container" id="palette-container">
        <div class="color-box">
          <div class="color" style="background-color: #ff6b6b"></div>
          <div class="color-info">
            <span class="color-value">#ff6b6b</span>
            <i class="fas fa-copy copy-btn" title="Copy Color"></i>
          </div>
        </div>

        <div class="color-box">
          <div class="color" style="background-color: #bdbdbd"></div>
          <div class="color-info">
            <span class="color-value">#bdbdbd</span>
            <i class="fas fa-copy copy-btn" title="Copy Color"></i>
          </div>
        </div>

        <div class="color-box">
          <div class="color" style="background-color: #ffff00"></div>
          <div class="color-info">
            <span class="color-value">#ffff00</span>
            <i class="fas fa-copy copy-btn" title="Copy Color"></i>
          </div>
        </div>

        <div class="color-box">
          <div class="color" style="background-color: #0033ee"></div>
          <div class="color-info">
            <span class="color-value">#0033ee</span>
            <i class="fas fa-copy copy-btn" title="Copy Color"></i>
          </div>
        </div>

        <div class="color-box">
          <div class="color" style="background-color: #781818"></div>
          <div class="color-info">
            <span class="color-value">#781818</span>
            <i class="fas fa-copy copy-btn" title="Copy Color"></i>
          </div>
        </div>

        <div class="color-box">
          <div class="color" style="background-color: #4bc72c"></div>
          <div class="color-info">
            <span class="color-value">#4bc72c</span>
            <i class="fas fa-copy copy-btn" title="Copy Color"></i>
          </div>
        </div>
      </div>
    </div>

    <script src="scripts/Color-Palette.js"></script>
  </body>
</html>
