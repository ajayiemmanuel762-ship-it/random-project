<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up / Login form</title>
    <link href="http://fonts.googleapis.com/css2?family=jost:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="05-randomproject.css">
  </head>
  <body>
    <main>
      <input type="checkbox" aria-hidden="false" id="chk">
      <div class="signup">
        <form action="" class="signupForm">
          <label for="chk">Sign up</label>
          <input type="text" required placeholder="User name">
          <input type="email" required placeholder="Email">
          <input type="tel" required placeholder="Phone No.">
          <input type="password" required placeholder="Password">
          <button>Sign up</button>
        </form>
      </div>

      <div class="login">
        <form action="">
          <label for="chk">Login</label>
          <input type="email" required placeholder="Email">
          <input type="password" required placeholder="Password">
          <button>Login</button>
        </form>
      </div>
    </main>
  </body>
</html>
