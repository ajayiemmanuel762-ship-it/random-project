<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sign up / Login form</title>
    <link rel="stylesheet" href="styles/randomproject-07.css">
    <link rel="stylesheet" href="http://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
  </head>
  <body>
    <!--main cotainer-->
      <div class="container" id="container">

        <!--sign-up container-->
        <div class="form-container sign-up container">
          <form action="">
            <h1>Create Account</h1>
            <div class="social-container">
                <a href="#" class="social"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="social"><i class="fa-brands fa-google-plus"></i></a>
                <a href="#" class="social"><i class="fa-brands fa-linkedin"></i></a>
            </div>
            <span>or use your email for registration</span>
            <input type="text" placeholder="Name">
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <button>Sign Up</button>
          </form>
        </div>

        <!---sign-in container-->
        <div class="form-container sign-in-container">
          <form action="">
            <h1>Sign in</h1>
            <div class="social-container">
                <a href="#" class="social"><i class="fa-brands fa-facebook"></i></a>
                <a href="#" class="social"><i class="fa-brands fa-google-plus"></i></a>
                <a href="#" class="social"><i class="fa-brands fa-linkedin"></i></a>
            </div>
            <span>or use your account</span>
            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">
            <a href="#">Forgot Your Password?</a>
            <button>Sign In</button>
          </form>
        </div>

        <!---overlay-container-->
        <div class="overlay-container">
          <div class="overlay">
            <div class="overlay-panel overlay left">
              <h1>Welcome Back</h1>
              <p>To keep connected with us, please login with your personal info</p>
              <button class="ghost" id="signIn">Sign in</button>
            </div>


            <div class="overlay-panel overlay right">
              <h1>Hello, Friend</h1>
              <p>Enter Your Personal Details and start Journey with us</p>
              <button class="ghost" id="signUp">Sign Up</button>
            </div>
          </div>
        </div>
      </div>

      <script src="script.js">
        const container = document.querySelector('container');
        const SigninButton = document.query('SignupButton');
        const SignupButton = document.query('SigninButton');
        
      </script>
  </body>
</html>
