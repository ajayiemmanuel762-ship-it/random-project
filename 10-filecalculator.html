<!DOCTYPE html>
<html>
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="styles/10-fileCalculator.css">
  </head>
  <body>
    <p class="line-1">

    <p class="js-calculation">
    </p>

    <button onclick="
      updateCalculation('1');
      ">1</button>

    <button onclick="
      updateCalculation('2');
      ">2</button>

    <button onclick="
      updateCalculation('3');
      ">3</button>

    <button class="line-3" onclick="
    updateCalculation('+');
    ">+</button>
    </p>


    <p>

    <button onclick="
      updateCalculation('4');
      ">4</button>

    <button onclick="
    updateCalculation('5');
    ">5</button>

    <button onclick="
    updateCalculation('6');
    ">6</button>

    <button class="line-3" onclick="
    updateCalculation('-');
    ">-</button>
    </p>


    <p>
    <button onclick="
     updateCalculation('7');
    ">7</button>

    <button onclick="
    updateCalculation('8');
    "
    >8</button>

    <button onclick="
    updateCalculation('9')
    ">9</button>

    <button class="line-3" onclick="
    updateCalculation('*')
    ">*</button>
    </p>

    <p>
    <button onclick="
    updateCalculation('0')
    ">0</button>

    <button onclick="
    updateCalculation('.')
    ">.</button>

    <button onclick="
    calculation = eval(calculation);
    displayCalculation();

    localStorage.setItem('calculation', calculation);
    ">=</button>

    <button class="line-3" onclick="
    updateCalculation('/')
    ">/</button>
    </p>
   
    <button class="clear-button" onclick="
    calculation = '';
    displayCalculation();
    
    localStorage.setItem('calculation', calculation);
    ">Clear</button>

    <script src="scripts/10-fileCalculator.js"></script>
  </body>
</html>
