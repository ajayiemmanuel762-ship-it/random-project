<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Work+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/MyFlipPage.css" />
    <title>flip page || NazaTheWaze</title>

    <style>
      body {
        background: #f4f7f9;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          "Open Sans",
          "Helvetica Neue",
          sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        color: #2d3436;
      }

      .container {
        width: 380px;
        height: 500px;
        perspective: 1500px;
      }

      .card {
        width: 100%;
        height: 100%;
        position: relative;
        transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        transform-style: preserve-3d;
      }

      /*custom class*/
      .card.flipped {
        transform: rotateY(180deg);
      }

      .face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        background: #ffffff;
        border-radius: 24px;
        padding: 48px 40px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.05),
          0 1px 3px rgba(0, 0, 0, 0.05);
        border: 1px solid 0 1px 3px rgba(0, 0, 0, 0.03);
      }

      .back {
        transform: rotateY(180deg);
      }

      .header {
        margin-bottom: 32px;
      }

      h2 {
        font-style: 26px;
        font-weight: 700;
        margin: 0;
        color: #1a1a1a;
      }
      .header p {
        font-style: 14px;
        color: #636e73;
        margin-top: 8px;
      }

      .inputs {
        display: flex;
        flex-direction: column;
        gap: 12px;
        flex-grow: 1;
      }

      input {
        padding: 14px 16px;
        border-radius: 12px;
        border: 1.5px solid #edf2f7;
        background: #f8fafc;
        font-style: 14px;
        transition: all 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #0984e3;
        background: #fff;
        box-shadow: 0 0 0 4px rgba(9, 132, 227, 0.1);
      }

      .submit {
        width: 100%;
        padding: 14px;
        margin-top: 24px;
        background: #1a1a1a;
        color: #ffffffff;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.2s,
          background 0.2s;
        font-size: 16px;
      }

      .submit:hover {
        background: #000;
        transform: translateY(-2px);
      }
      .submit:active {
        transform: translateY(0);
      }

      .footer {
        margin-top: 24px;
        text-align: center;
        font-size: 14px;
        color: #636e72;
      }

      span {
        color: #0984e3;
        font-weight: 600;
        cursor: pointer;
        margin-left: 4px;
      }

      span:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card" id="card">
        <!--Front form-->
        <div class="face front">
          <div class="header">
            <h2>Welcome Back</h2>
            <p>Enter your details to continue</p>
          </div>
          <div class="inputs">
            <input type="email" placeholder="Email Address" />
            <input type="password" placeholder="Password" />
          </div>
          <button class="submit">Sign in</button>
          <div class="footer">
            Don't have an account? <span onclick="flip()">Join now</span>
          </div>
        </div>

        <!--Back form-->
        <div class="face back">
          <div class="header">
            <h2>Create Account</h2>
            <p>Start your journey with us</p>
          </div>
          <div class="inputs">
            <input type="text" placeholder="Full Name" />
            <input type="email" placeholder="Email Address" />
            <input type="password" placeholder="Create Password" />
          </div>
          <button class="submit">Get Started</button>
          <div class="footer">
            Already a member? <span onclick="flip()">Log In</span>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script>
    function flip() {
      document.getElementById("card").classList.toggle("flipped");
    }
  </script>
</html>
